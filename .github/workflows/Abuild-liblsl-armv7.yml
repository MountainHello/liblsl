name: Build liblsl for ARMv7 (Docker Ubuntu 20.04)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Ubuntu 20.04 container
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            ubuntu:20.04 \
            bash -c "
              # 更新并安装依赖
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                ca-certificates
              
              # 创建构建目录并编译
              mkdir -p build && cd build
              cmake .. \
                -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
                -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
                -DCMAKE_CXX_FLAGS=\"-D_GLIBCXX_USE_CXX11_ABI=0\" \
                -DCMAKE_C_FLAGS=\"-march=armv7-a -mfloat-abi=hard\" \
                -DCMAKE_INSTALL_PREFIX=\$(pwd)/install \
                -DBUILD_SHARED_LIBS=ON
              make -j\$(nproc)
              make install
              
              # 打包
              cd install
              tar -czvf /workspace/liblsl-armv7-ubuntu20.tar.gz .
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liblsl-armv7-ubuntu20
          path: liblsl-armv7-ubuntu20.tar.gz
