name: 'Build liblsl for ARMv7 (Ubuntu 20.04)'

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 核心步骤：在 ARMv7 + Ubuntu 20.04 容器内执行编译
      - name: Build in Docker (ARMv7/Ubuntu 20.04)
        id: build_in_container
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7          # 目标架构
          distro: ubuntu20.04  # 目标系统版本，这是保证 glibc 兼容性的关键[citation:3]

          # 在容器内执行的编译命令
          run: |
            # 更新软件源并安装依赖
            apt-get update
            apt-get install -y cmake build-essential

            # 创建构建目录并编译
            mkdir build && cd build
            cmake .. -DCMAKE_INSTALL_PREFIX=$(pwd)/install
            make -j$(nproc)
            make install

            # 打包编译好的文件
            cd install
            tar -czvf /tmp/liblsl-armv7-ubuntu20.tar.gz .

          # 将容器内生成的压缩包保存为 GitHub Actions 的产物
          env: |
            # 将容器内的 /tmp 目录映射到宿主机，以便传递文件
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liblsl-armv7-ubuntu20
          path: /tmp/liblsl-armv7-ubuntu20.tar.gz
